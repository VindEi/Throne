name: Throne Windows Portable Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag"
        required: true
        default: "1.0.0"

jobs:
  build-go:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v4.3.1
      - name: Cache Common Download
        id: cache-common
        uses: actions/cache@v6.1.0
        with:
          path: artifacts.tgz
          key: CommonCache-windows-amd64-${{ hashFiles('script/build_go.sh', 'core/**') }}-1.26.7
      - name: Install Golang
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.26.7"
          cache-dependency-path: core/server/go.sum
      - name: Install Protoc
        if: steps.cache-common.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build golang parts
        if: steps.cache-common.outputs.cache-hit != 'true'
        shell: bash
        run: GOOS=windows GOARCH=amd64 ./script/build_go.sh
      - name: Tar files
        if: steps.cache-common.outputs.cache-hit != 'true'
        run: tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-${{ github.sha }}-Common-windows-amd64
          path: artifacts.tgz
          compression-level: 0

  build-cpp:
    permissions:
      contents: read
    needs: build-go
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ github.event.inputs.tag }}
      DEST: ${{ github.workspace }}/deployment/windows-amd64
      DEST_SUFFIX: windows-amd64
      ARCH: x64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v4.3.1
      - name: Checking out the web dashboard
        uses: actions/checkout@v4.3.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-amd64-6.11.2
          variant: sccache
          max-size: 500M
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: Throne-${{ github.sha }}-Common-windows-amd64
          path: download-artifact
      - name: Windows - Cache Qt and OpenSSL
        id: cache-winqt
        uses: actions/cache@v6.1.0
        with:
          path: |
            qt.7z
            openssl.7z
          key: WinQt-6.11.2-x64
      - name: Windows - Download Qt and OpenSSL
        shell: bash
        if: steps.cache-winqt.outputs.cache-hit != 'true'
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.2/Qt_6.11.2_x64.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
      - name: Windows - Generate MakeFile and Build
        shell: bash
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Create Portable Zip
        shell: bash
        run: |
          cd deployment
          mv windows-amd64 Throne
          7z a -tzip Throne-windows64-portable.zip Throne
      - name: Upload Portable Release
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Throne-windows64-portable
          path: deployment/Throne-windows64-portable.zip
          compression-level: 0
